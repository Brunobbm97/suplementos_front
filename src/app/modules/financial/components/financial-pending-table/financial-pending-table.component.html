<div class="p-2">
    <div class="flex justify-content-end gap-3 mb-2 text-xs font-bold">
        <span class="text-green-600"><i class="pi pi-stop-fill"></i> Vence Hoje</span>
        <span class="text-red-600"><i class="pi pi-stop-fill"></i> Atrasado</span>
        <span class="text-blue-600"><i class="pi pi-stop-fill"></i> Não vencido</span>
    </div>

    <p-table [value]="pendingTransactions" [loading]="loading" responsiveLayout="scroll"
        styleClass="p-datatable-sm p-datatable-striped">
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 10%">Data</th>
                <th style="width: 10%">Ref #</th>
                <th style="width: 25%">Grupo (Categoria)</th>
                <th style="width: 30%">Descrição</th>
                <th style="width: 15%">Valor</th>
                <th style="width: 10%" class="text-center">Liquidar</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-t>
            <tr [ngClass]="getStatusClass(t.dueDate)">
                <td>{{ t.dueDate | date:'dd/MM/yyyy' }}</td>
                <td>{{ t.referenceId || '-' }}</td>
                <td><span class="font-bold text-primary">{{ t.categoryName }}</span></td>
                <td>{{ t.description }}</td>
                <td [ngClass]="t.type === 'EXPENSE' ? 'text-red-600' : 'text-green-600'">
                    {{ t.amount | currency:'BRL' }}
                </td>
                <td class="text-center">
                    <p-button icon="pi pi-check" [rounded]="true" [text]="true" severity="success"
                        (onClick)="liquidar(t.id)" pTooltip="Confirmar Pagamento/Recebimento">
                    </p-button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <div *ngIf="pendingTransactions.length === 0" class="text-center p-4 text-500">
        Não há lançamentos pendentes para o período.
    </div>
</div>
