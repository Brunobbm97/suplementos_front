<div class="erp-page-container">
    <div class="page-header flex justify-content-between align-items-center">
        <h2 class="page-title">Categorias Financeiras</h2>
        <p-button label="Nova Categoria" icon="pi pi-plus" severity="success" (onClick)="openNew()"></p-button>
    </div>

    <p-table [value]="categories" [tableStyle]="{ 'min-width': '40rem' }"
        styleClass="p-datatable-striped p-datatable-sm">
        <ng-template pTemplate="header">
            <tr>
                <th class="col-id">ID</th>
                <th class="col-name">Nome da Categoria</th>
                <th class="col-type">Tipo</th>
                <th class="col-actions text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-cat>
            <tr>
                <td>{{ cat.id }}</td>
                <td class="category-name-cell">{{ cat.name }}</td>
                <td>
                    <p-tag [value]="cat.type === 'REVENUE' ? 'Receita' : 'Despesa'"
                        [severity]="cat.type === 'REVENUE' ? 'success' : 'danger'">
                    </p-tag>
                </td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info"
                        (onClick)="editCategory(cat)"></p-button>
                    <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"
                        (onClick)="deleteCategory(cat)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="empty-message text-center">Nenhuma categoria cadastrada.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<!-- Removido o [style]="{ width: '400px' }" e adicionado o styleClass="finance-dialog" -->
<p-dialog [(visible)]="displayForm" [header]="isEditing ? 'Editar Categoria' : 'Nova Categoria'" [modal]="true"
    styleClass="finance-dialog">
    <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()" class="p-fluid category-form">

        <div class="field">
            <label class="field-label">Nome da Categoria *</label>
            <input type="text" pInputText formControlName="name" placeholder="Ex: Conta de Luz, Vendas Físicas" />
            <small class="p-error form-error"
                *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
                O nome é obrigatório.
            </small>
        </div>

        <div class="field form-spacing">
            <label class="field-label">Tipo da Categoria *</label>
            <p-dropdown [options]="transactionTypes" formControlName="type" optionLabel="label" optionValue="value"
                placeholder="Selecione o tipo..."></p-dropdown>
            <small class="p-error form-error"
                *ngIf="categoryForm.get('type')?.invalid && categoryForm.get('type')?.touched">
                Selecione se é Receita ou Despesa.
            </small>
        </div>

        <div class="form-actions flex justify-content-end">
            <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary"
                (onClick)="displayForm = false"></p-button>
            <p-button [label]="isEditing ? 'Salvar' : 'Criar'" icon="pi pi-check" type="submit"
                [disabled]="categoryForm.invalid"></p-button>
        </div>
    </form>
</p-dialog>

<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
