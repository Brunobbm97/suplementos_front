<div class="erp-page-container">
    <div class="page-header flex justify-content-between align-items-center">
        <h2 class="page-title">Gestão de Locais</h2>
        <p-button label="Novo Local" icon="pi pi-plus" severity="success" (onClick)="openNew()"></p-button>
    </div>

    <p-table [value]="locations" [tableStyle]="{ 'min-width': '50rem' }"
        styleClass="p-datatable-striped p-datatable-sm">
        <ng-template pTemplate="header">
            <tr>
                <th class="col-id">ID</th>
                <th class="col-name">Nome do Local</th>
                <th class="col-type">Tipo</th>
                <th class="col-city">Cidade/UF</th>
                <th class="col-phone">Telefone</th>
                <th class="col-actions text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-loc>
            <tr>
                <td>{{ loc.id }}</td>
                <td class="location-name-cell">{{ loc.name }}</td>
                <td>
                    <p-tag [value]="loc.type === 'LOJA' ? 'Loja Física' : 'Depósito'"
                        [severity]="loc.type === 'LOJA' ? 'success' : 'warning'">
                    </p-tag>
                </td>
                <td class="text-secondary">{{ loc.city }} <span *ngIf="loc.state">- {{ loc.state }}</span></td>
                <td class="text-secondary">{{ loc.phone }}</td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info"
                        (onClick)="editLocation(loc)"></p-button>
                    <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"
                        (onClick)="deleteLocation(loc)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="empty-message text-center">Nenhum local cadastrado.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="displayForm" [header]="isEditing ? 'Editar Local' : 'Novo Local'" [modal]="true"
    styleClass="location-dialog">
    <form [formGroup]="locationForm" (ngSubmit)="saveLocation()" class="p-fluid grid form-container">

        <!-- Seção: Dados Principais -->
        <div class="col-12 form-section-header">
            <h5 class="section-title">Dados Principais</h5>
        </div>

        <div class="field col-12 md:col-8">
            <label class="field-label">Nome do Local *</label>
            <input pInputText formControlName="name" placeholder="Ex: Loja Matriz" />
        </div>
        <div class="field col-12 md:col-4">
            <label class="field-label">Tipo *</label>
            <p-dropdown [options]="locationTypes" formControlName="type" optionLabel="label"
                optionValue="value"></p-dropdown>
        </div>

        <!-- Seção: Endereço -->
        <div class="col-12 form-section-header with-margin">
            <h5 class="section-title">Endereço</h5>
        </div>

        <div class="field col-12 md:col-3">
            <label class="field-label">CEP</label>
            <input pInputText formControlName="zipCode" placeholder="00000-000" />
        </div>
        <div class="field col-12 md:col-7">
            <label class="field-label">Logradouro / Rua *</label>
            <input pInputText formControlName="street" placeholder="Rua das Flores" />
        </div>
        <div class="field col-12 md:col-2">
            <label class="field-label">Número *</label>
            <input pInputText formControlName="number" placeholder="123" />
        </div>

        <div class="field col-12 md:col-5">
            <label class="field-label">Bairro *</label>
            <input pInputText formControlName="neighborhood" placeholder="Centro" />
        </div>
        <div class="field col-12 md:col-5">
            <label class="field-label">Cidade</label>
            <input pInputText formControlName="city" placeholder="João Pessoa" />
        </div>
        <div class="field col-12 md:col-2">
            <label class="field-label">UF</label>
            <input pInputText formControlName="state" placeholder="PB" maxlength="2" />
        </div>

        <!-- Seção: Contato -->
        <div class="col-12 form-section-header with-margin">
            <h5 class="section-title">Contato</h5>
        </div>

        <div class="field col-12 md:col-6">
            <label class="field-label">Telefone *</label>
            <input pInputText formControlName="phone" placeholder="(00) 00000-0000" />
        </div>
        <div class="field col-12 md:col-6">
            <label class="field-label">E-mail</label>
            <input pInputText formControlName="email" placeholder="loja@suplementos.com" />
        </div>

        <!-- Ações do Formulário -->
        <div class="col-12 form-actions flex justify-content-end">
            <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary"
                (onClick)="displayForm = false"></p-button>
            <p-button [label]="isEditing ? 'Salvar Alterações' : 'Criar Local'" icon="pi pi-check" type="submit"
                [disabled]="locationForm.invalid"></p-button>
        </div>
    </form>
</p-dialog>

<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
