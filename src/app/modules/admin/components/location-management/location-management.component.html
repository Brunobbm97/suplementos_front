<div class="card p-4 shadow-2 border-round bg-white">
    <div class="flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Gestão de Locais e Lojas</h2>
        <p-button label="Novo Local" icon="pi pi-plus" severity="success" (onClick)="openNew()"></p-button>
    </div>

    <p-table [value]="locations" [tableStyle]="{ 'min-width': '50rem' }"
        styleClass="p-datatable-striped p-datatable-sm">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Nome do Local</th>
                <th>Tipo</th>
                <th>Cidade/UF</th>
                <th>Telefone</th>
                <th class="text-center">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-loc>
            <tr>
                <td>{{ loc.id }}</td>
                <td class="font-bold">{{ loc.name }}</td>
                <td>
                    <p-tag [value]="loc.type === 'LOJA' ? 'Loja Física' : 'Depósito'"
                        [severity]="loc.type === 'LOJA' ? 'success' : 'warning'">
                    </p-tag>
                </td>
                <td class="text-500">{{ loc.city }} <span *ngIf="loc.state">- {{ loc.state }}</span></td>
                <td class="text-500">{{ loc.phone }}</td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info"
                        (onClick)="editLocation(loc)"></p-button>
                    <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"
                        (onClick)="deleteLocation(loc)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-4">Nenhum local cadastrado.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="displayForm" [header]="isEditing ? 'Editar Local' : 'Novo Local'" [modal]="true"
    [style]="{ width: '700px' }">
    <form [formGroup]="locationForm" (ngSubmit)="saveLocation()" class="p-fluid grid mt-2">

        <div class="col-12 mb-2">
            <h5 class="m-0 border-bottom-1 border-300 pb-2">Dados Principais</h5>
        </div>

        <div class="field col-12 md:col-8">
            <label class="font-bold">Nome do Local *</label>
            <input pInputText formControlName="name" placeholder="Ex: Loja Matriz" />
        </div>
        <div class="field col-12 md:col-4">
            <label class="font-bold">Tipo *</label>
            <p-dropdown [options]="locationTypes" formControlName="type" optionLabel="label"
                optionValue="value"></p-dropdown>
        </div>

        <div class="col-12 mb-2 mt-3">
            <h5 class="m-0 border-bottom-1 border-300 pb-2">Endereço</h5>
        </div>

        <div class="field col-12 md:col-3">
            <label class="font-bold">CEP</label>
            <input pInputText formControlName="zipCode" placeholder="00000-000" />
        </div>
        <div class="field col-12 md:col-7">
            <label class="font-bold">Logradouro / Rua *</label>
            <input pInputText formControlName="street" placeholder="Rua das Flores" />
        </div>
        <div class="field col-12 md:col-2">
            <label class="font-bold">Número *</label>
            <input pInputText formControlName="number" placeholder="123" />
        </div>

        <div class="field col-12 md:col-5">
            <label class="font-bold">Bairro *</label>
            <input pInputText formControlName="neighborhood" placeholder="Centro" />
        </div>
        <div class="field col-12 md:col-5">
            <label class="font-bold">Cidade</label>
            <input pInputText formControlName="city" placeholder="João Pessoa" />
        </div>
        <div class="field col-12 md:col-2">
            <label class="font-bold">UF</label>
            <input pInputText formControlName="state" placeholder="PB" maxlength="2" />
        </div>

        <div class="col-12 mb-2 mt-3">
            <h5 class="m-0 border-bottom-1 border-300 pb-2">Contato</h5>
        </div>

        <div class="field col-12 md:col-6">
            <label class="font-bold">Telefone *</label>
            <input pInputText formControlName="phone" placeholder="(00) 00000-0000" />
        </div>
        <div class="field col-12 md:col-6">
            <label class="font-bold">E-mail</label>
            <input pInputText formControlName="email" placeholder="loja@suplementos.com" />
        </div>

        <div class="col-12 flex justify-content-end gap-2 mt-4 pt-4 border-top-1 border-300">
            <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary"
                (onClick)="displayForm = false"></p-button>
            <p-button [label]="isEditing ? 'Salvar Alterações' : 'Criar Local'" icon="pi pi-check" type="submit"
                [disabled]="locationForm.invalid"></p-button>
        </div>
    </form>
</p-dialog>

<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
