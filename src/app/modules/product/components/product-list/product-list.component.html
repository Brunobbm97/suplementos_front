<div class="card shadow-1 p-4 bg-white border-round">
    <div class="flex justify-content-between align-items-center mb-4">
        <h2 class="m-0 text-900">Catálogo de Produtos</h2>
        <p-button label="Novo Produto" icon="pi pi-plus" severity="success" (onClick)="openNew()"></p-button>

    </div>

    <p-table [value]="products" [loading]="loading" [rows]="10" [paginator]="true" responsiveLayout="stack"
        breakpoint="960px" styleClass="p-datatable-striped">
        <ng-template pTemplate="header">
            <tr>
                <th>SKU</th>
                <th>Nome</th>
                <th>Marca</th>
                <th>Sabor</th>
                <th>Preço Venda</th>
                <th>Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product>
            <tr>
                <td><p-tag [value]="product.sku" severity="info"></p-tag></td>
                <td class="font-bold">{{ product.name }}</td>
                <td>{{ product.brand }}</td>
                <td>{{ product.flavor || 'N/A' }}</td>
                <td>{{ product.salePrice | currency:'BRL' }}</td>
                <td>
                    <div class="flex gap-2">
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" [severity]="severityEdit"
                            (onClick)="editProduct(product)">
                        </p-button>

                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" [severity]="severityDelete"
                            (onClick)="deleteProduct(product)" pTooltip="Excluir Produto" tooltipPosition="top">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-4">Nenhum produto encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-product-form [visible]="displayForm" [product]="selectedProduct" (onClose)="displayForm = false"
    (onSave)="handleSave($event)">
</app-product-form>
